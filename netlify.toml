[build]
  command = "node scripts/validate-site.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"



[[redirects]]
  from = "/blog"
  to = "/#ultimo-articolo"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/#ultimo-articolo"
  status = 301

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 301
